name: Publish offline ZIP release

on:
  push:
    branches: [main]
    paths:
      - release-version.txt
      - scripts/build_offline_release.py
      - .github/workflows/release-offline.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Verify original models and build ZIP
        run: python scripts/build_offline_release.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          release_tag="$(cat release-version.txt)"
          gh release create "$release_tag" dist/veil-offline.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "ヴェール $release_tag — 検出モデル同梱版" \
            --notes-file dist/release-notes.md
